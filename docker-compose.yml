name: quest-x11

services:
  builder:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: quest-x11-builder
    image: quest-x11-builder
    profiles: [builder]
    volumes:
      - workspace:/home/builder/workspace
      - gradle:/home/builder/.gradle
      - ./build/apk:/home/builder/apk

volumes:
  workspace:
  gradle:
